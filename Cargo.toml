[package]
name = "homerunner"
version = "0.1.0"
authors = ["Alfi Maulana <alfi.maulana.f@gmail.com>"]
categories = ["command-line-utilities", "development-tools"]
edition = "2024"
keywords = ["github-actions", "self-hosted-runner", "docker", "ci"]
license = "MIT"
repository = "https://github.com/threeal/homerunner"
rust-version = "1.99"
description = "Persistent self-hosted GitHub Actions runners in Docker"

[dependencies]
clap = "4.6.7"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
cargo = "warn"

[lints.rust]
warnings = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tarpaulin_include)"] }
