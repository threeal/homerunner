name: CD
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  deploy-images:
    name: Deploy Images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy images
        run: docker buildx bake --set '*.output=type=registry,rewrite-timestamp=true'
